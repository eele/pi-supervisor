<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="700" viewBox="0 0 1460 700" font-family="Lucida Grande, Segoe UI, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/><stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec1ff"/><stop offset="0.5" stop-color="#3876d6"/><stop offset="1" stop-color="#1e5fc0"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1460" height="700" fill="#b8bcc2"/>

  <!-- ═══════════ Window A: Background Services tab active ═══════════ -->
  <g filter="url(#winShadow)">
    <rect x="36" y="28" width="648" height="640" rx="8" fill="#ececec" stroke="#9d9d9d"/>
  </g>
  <rect x="37" y="29" width="646" height="46" rx="8" fill="url(#titlebar)"/>
  <text x="360" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d4d4d">Pi Supervisor</text>
  <circle cx="60" cy="52" r="7" fill="#ff5f57" stroke="#e0443e"/>
  <circle cx="82" cy="52" r="7" fill="#febc2e" stroke="#d89e23"/>
  <circle cx="104" cy="52" r="7" fill="#28c840" stroke="#1aab29"/>

  <!-- tabs: Background Services selected -->
  <rect x="52" y="96" width="110" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="107" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Sessions</text>
  <rect x="320" y="96" width="90" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="365" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Sandbox</text>
  <rect x="52" y="120" width="616" height="440" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
  <path d="M166 122 V94 Q166 90 170 90 H312 Q316 90 316 94 V122" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="241" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d1d1f">Background Services</text>
  <text x="428" y="114" font-size="10" fill="#8e8e93">click a tab to switch module ←/→</text>

  <!-- service rows -->
  <circle cx="76" cy="160" r="5" fill="#28c840"/>
  <text x="92" y="158" font-size="13" fill="#1d1d1f">Pageant SSH Agent</text>
  <text x="92" y="173" font-size="10" fill="#8e8e93">all ~/.ssh/*.ppk loaded (top-level only) · SSH_AUTH_SOCK maintained</text>
  <rect x="560" y="146" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="162" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>
  <line x1="66" y1="194" x2="656" y2="194" stroke="#e3e3e3"/>

  <circle cx="76" cy="228" r="5" fill="#28c840"/>
  <text x="92" y="226" font-size="13" fill="#1d1d1f">Agent TCP Bridge</text>
  <text x="92" y="241" font-size="10" fill="#8e8e93">tcp://0.0.0.0:60022 · token-authenticated · Pageant WM_COPYDATA</text>
  <rect x="560" y="214" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="230" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>
  <line x1="66" y1="262" x2="656" y2="262" stroke="#e3e3e3"/>

  <circle cx="76" cy="296" r="5" fill="#28c840"/>
  <text x="92" y="294" font-size="13" fill="#1d1d1f">Notify Hub</text>
  <text x="92" y="309" font-size="10" fill="#8e8e93">http://0.0.0.0:60000/notify · Windows toast (reminder)</text>
  <rect x="560" y="282" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="298" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>

  <!-- persistence note inside the page -->
  <text x="72" y="540" font-size="10" fill="#8e8e93">start/stop intent is persisted to config.json — a manually stopped service stays Stopped across restarts</text>

  <text x="56" y="582" font-size="10" fill="#8e8e93">Background Services tab — one module per tab · Startup row stays fixed below the tab card</text>

  <text x="60" y="608" font-size="11" fill="#5f5f64">Startup: launch this app at logon (replaces legacy Startup entries)</text>
  <rect x="608" y="594" width="52" height="22" rx="11" fill="url(#btnBlue)" stroke="#1e5fc0"/>
  <text x="621" y="609" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff" stroke="#1e5fc0" stroke-width="0.35">ON</text>
  <circle cx="648" cy="605" r="9" fill="#fdfdfd" stroke="#9d9d9d"/>
  <circle cx="648" cy="605" r="6" fill="url(#titlebar)"/>

  <rect x="37" y="627" width="646" height="40" fill="url(#titlebar)"/>
  <line x1="37" y1="627" x2="683" y2="627" stroke="#adadad"/>
  <text x="60" y="651" font-size="11" fill="#5f5f64">All services healthy · 3/3 running · pi-ai detached</text>

  <!-- ═══════════ Window B: Sandbox tab active ═══════════ -->
  <g transform="translate(736,0)">
    <g filter="url(#winShadow)">
      <rect x="36" y="28" width="648" height="640" rx="8" fill="#ececec" stroke="#9d9d9d"/>
    </g>
    <rect x="37" y="29" width="646" height="46" rx="8" fill="url(#titlebar)"/>
    <text x="360" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d4d4d">Pi Supervisor</text>
    <circle cx="60" cy="52" r="7" fill="#ff5f57" stroke="#e0443e"/>
    <circle cx="82" cy="52" r="7" fill="#febc2e" stroke="#d89e23"/>
    <circle cx="104" cy="52" r="7" fill="#28c840" stroke="#1aab29"/>

    <!-- tabs: Sandbox selected -->
    <rect x="52" y="96" width="110" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
    <text x="107" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Sessions</text>
    <rect x="166" y="96" width="150" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
    <text x="241" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Background Services</text>
    <rect x="52" y="120" width="616" height="440" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
    <path d="M320 122 V94 Q320 90 324 90 H406 Q410 90 410 94 V122" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="365" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d1d1f">Sandbox</text>

    <!-- sandbox state -->
    <text x="72" y="156" font-size="13" font-weight="bold" fill="#1d1d1f">pi-ai</text>
    <rect x="118" y="142" width="72" height="19" rx="9" fill="#28c840"/>
    <text x="154" y="155" text-anchor="middle" font-size="10" fill="#ffffff">detached</text>
    <text x="72" y="186" font-size="11" fill="#5f5f64">kit         zot.byte.art/blackbox/pi-kit:20261025.150332.857</text>
    <text x="72" y="206" font-size="11" fill="#5f5f64">Mount path  C:\Users\ele\Tea   (virtiofs rw)</text>
    <text x="72" y="226" font-size="11" fill="#5f5f64">residency   sbx run -d · permanent, no auto-stop</text>

    <rect x="72" y="248" width="110" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
    <text x="127" y="266" text-anchor="middle" font-size="11" fill="#1d1d1f">Refresh</text>
    <rect x="194" y="248" width="120" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
    <text x="254" y="266" text-anchor="middle" font-size="11" fill="#1d1d1f">Push Tokens</text>
    <rect x="546" y="248" width="104" height="28" rx="5" fill="url(#btnBlue)" stroke="#1e5fc0"/>
    <text x="598" y="266" text-anchor="middle" font-size="11" fill="#ffffff">Recreate</text>

    <!-- during-rebuild ticker (replaces the button row while running) -->
    <text x="72" y="316" font-size="10" fill="#8e8e93">Recreate in progress — buttons swap to a step ticker:</text>
    <rect x="72" y="326" width="578" height="24" rx="5" fill="#f6f6f6" stroke="#c9c9c9"/>
    <text x="88" y="342" font-size="11" fill="#1d1d1f">▸ rm · resolve latest kit · run -d · wait ready · push tokens ✔</text>

    <!-- state notes inside the page -->
    <text x="72" y="500" font-size="10" fill="#8e8e93">name is fixed (pi-ai, no rename control) · not created → chip reads </text>
    <text x="72" y="516" font-size="10" fill="#8e8e93">&#34;not created&#34; and Recreate takes the pure-create path (skips rm)</text>

    <text x="56" y="582" font-size="10" fill="#8e8e93">Sandbox tab — status + one-click ops · Recreate confirm dialog in mockup 3</text>

    <text x="60" y="608" font-size="11" fill="#5f5f64">Startup: launch this app at logon (replaces legacy Startup entries)</text>
    <rect x="608" y="594" width="52" height="22" rx="11" fill="url(#btnBlue)" stroke="#1e5fc0"/>
    <text x="621" y="609" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff" stroke="#1e5fc0" stroke-width="0.35">ON</text>
    <circle cx="648" cy="605" r="9" fill="#fdfdfd" stroke="#9d9d9d"/>
    <circle cx="648" cy="605" r="6" fill="url(#titlebar)"/>

    <rect x="37" y="627" width="646" height="40" fill="url(#titlebar)"/>
    <line x1="37" y1="627" x2="683" y2="627" stroke="#adadad"/>
    <text x="60" y="651" font-size="11" fill="#5f5f64">pi-ai detached · kit 20261025.150332.857 · 4 live sessions</text>
  </g>
