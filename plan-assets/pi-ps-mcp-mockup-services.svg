<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="700" viewBox="0 0 1460 700" font-family="Lucida Grande, Segoe UI, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/><stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec1ff"/><stop offset="0.5" stop-color="#3876d6"/><stop offset="1" stop-color="#1e5fc0"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1460" height="700" fill="#b8bcc2"/>

  <!-- ═══════════ Background Services tab — hostps service row added ═══════════ -->
  <g filter="url(#winShadow)">
    <rect x="36" y="28" width="648" height="640" rx="8" fill="#ececec" stroke="#9d9d9d"/>
  </g>
  <rect x="37" y="29" width="646" height="46" rx="8" fill="url(#titlebar)"/>
  <text x="360" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d4d4d">Pi Supervisor</text>
  <circle cx="60" cy="52" r="7" fill="#ff5f57" stroke="#e0443e"/>
  <circle cx="82" cy="52" r="7" fill="#febc2e" stroke="#d89e23"/>
  <circle cx="104" cy="52" r="7" fill="#28c840" stroke="#1aab29"/>

  <!-- tabs: Background Services active; new 4th tab "PS Audit" -->
  <rect x="52" y="96" width="100" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="102" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Sessions</text>
  <rect x="310" y="96" width="84" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="352" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Sandbox</text>
  <rect x="400" y="96" width="84" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="442" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">PS Audit</text>
  <rect x="52" y="120" width="616" height="440" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
  <path d="M156 122 V94 Q156 90 160 90 H300 Q304 90 304 94 V122" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="230" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d1d1f">Background Services</text>

  <!-- service rows -->
  <circle cx="76" cy="152" r="5" fill="#28c840"/>
  <text x="92" y="150" font-size="13" fill="#1d1d1f">Pageant SSH Agent</text>
  <text x="92" y="165" font-size="10" fill="#8e8e93">all ~/.ssh/*.ppk loaded (top-level only) · SSH_AUTH_SOCK maintained</text>
  <rect x="560" y="138" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="154" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>
  <line x1="66" y1="184" x2="656" y2="184" stroke="#e3e3e3"/>

  <circle cx="76" cy="216" r="5" fill="#28c840"/>
  <text x="92" y="214" font-size="13" fill="#1d1d1f">Agent TCP Bridge</text>
  <text x="92" y="229" font-size="10" fill="#8e8e93">tcp://0.0.0.0:60022 · token-authenticated · Pageant WM_COPYDATA</text>
  <rect x="560" y="202" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="218" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>
  <line x1="66" y1="248" x2="656" y2="248" stroke="#e3e3e3"/>

  <circle cx="76" cy="280" r="5" fill="#28c840"/>
  <text x="92" y="278" font-size="13" fill="#1d1d1f">Notify Hub</text>
  <text x="92" y="293" font-size="10" fill="#8e8e93">http://0.0.0.0:60000/notify · Windows toast (reminder)</text>
  <rect x="560" y="266" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="282" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>
  <line x1="66" y1="312" x2="656" y2="312" stroke="#e3e3e3"/>

  <!-- NEW: hostps row (highlighted) -->
  <rect x="60" y="322" width="600" height="60" rx="6" fill="#f2f7ff" stroke="#3876d6" stroke-dasharray="4 3" stroke-width="1.2"/>
  <circle cx="76" cy="346" r="5" fill="#28c840"/>
  <text x="92" y="344" font-size="13" fill="#1d1d1f">Host PowerShell MCP</text>
  <text x="92" y="359" font-size="10" fill="#8e8e93">http://0.0.0.0:37022/mcp · Bearer (HKCU HOST_PS_KEY) · audit → ~/.pi-su/ps-audit.db</text>
  <rect x="560" y="332" width="90" height="24" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="605" y="348" text-anchor="middle" font-size="11" fill="#1d1d1f">Stop</text>

  <!-- persistence note inside the page -->
  <text x="72" y="540" font-size="10" fill="#8e8e93">start/stop intent is persisted to config.json — a manually stopped service stays Stopped across restarts</text>

  <text x="56" y="582" font-size="10" fill="#8e8e93">Background Services tab — 4th supervised service (idx 3, id "hostps") · watchdog covers it like bridge/notify</text>

  <text x="60" y="608" font-size="11" fill="#5f5f64">Startup: launch this app at logon (replaces legacy Startup entries)</text>
  <rect x="608" y="594" width="52" height="22" rx="11" fill="url(#btnBlue)" stroke="#1e5fc0"/>
  <text x="621" y="609" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff" stroke="#1e5fc0" stroke-width="0.35">ON</text>
  <circle cx="648" cy="605" r="9" fill="#fdfdfd" stroke="#9d9d9d"/>
  <circle cx="648" cy="605" r="6" fill="url(#titlebar)"/>

  <rect x="37" y="627" width="646" height="40" fill="url(#titlebar)"/>
  <line x1="37" y1="627" x2="683" y2="627" stroke="#adadad"/>
  <text x="60" y="651" font-size="11" fill="#5f5f64">All services healthy · 4/4 running · pi-ai detached · 3 live sessions</text>

  <!-- ═══════════ Annotations ═══════════ -->
  <g font-size="12" fill="#2b2b2b">
    <text x="720" y="60" font-size="15" font-weight="bold">hostps 后台服务（示意图）</text>
    <text x="720" y="92">1. 新增第 4 个受管服务行 “Host PowerShell MCP”（虚线框为本次新增）：</text>
    <text x="740" y="112">· supervisor idx=3，id "hostps"，start/stop/intent/watchdog 与 bridge、notify 同机制</text>
    <text x="740" y="130">· subtitle 显示监听地址、鉴权来源、审计库路径</text>
    <text x="740" y="148">· 失败时状态点转红（failed），watchdog 按 intent 自动重启</text>
    <text x="720" y="184">2. 网关随 pi-supervisor 主程序自启（HKCU Run 开机自启已覆盖），</text>
    <text x="740" y="202">不再需要独立 hostps-bootstrap / Startup 脚本。</text>
    <text x="720" y="238">3. 端口 bind 失败（37022 被占）→ 行状态 failed + subtitle 报错，</text>
    <text x="740" y="256">与 bridge 相同的调用线程同步 bind 模式，不闪退主程序。</text>
    <text x="720" y="292">4. Stop ≠ 解绑端口（r4.1）：切到 access-disabled 模式——监听常驻、</text>
    <text x="740" y="310">:37022 保持，tools/call 返回正常 MCP 应答 [HOST_PS_GATEWAY_DISABLED]</text>
    <text x="740" y="328">= 告知 agent 无权限执行 PowerShell（不暂停推理、不按故障通知用户）；</text>
    <text x="740" y="346">仅杀在册 powershell 进程树，审计照常落 disabled 行。Start 恢复 running。</text>
    <text x="720" y="380">5. 行状态三态：running 绿 / stopped 灰（界面停止，subtitle 注明</text>
    <text x="740" y="398">端口保持）/ failed 红（真故障，watchdog 复活中）——停止与故障一眼可辨；</text>
    <text x="740" y="416">仅“非界面停止”的端口不通才触发 agent 侧连接异常规约。</text>
    <text x="720" y="450">6. 状态栏计数纳入 hostps：“4 of 4 services running”。</text>
  </g>
</svg>
