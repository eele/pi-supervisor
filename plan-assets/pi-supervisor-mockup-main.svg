<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" font-family="Lucida Grande, Segoe UI, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/><stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec1ff"/><stop offset="0.5" stop-color="#3876d6"/><stop offset="1" stop-color="#1e5fc0"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="720" height="700" fill="#b8bcc2"/>

  <!-- window -->
  <g filter="url(#winShadow)">
    <rect x="36" y="28" width="648" height="640" rx="8" fill="#ececec" stroke="#9d9d9d"/>
  </g>

  <!-- title bar (no bottom separator) -->
  <rect x="37" y="29" width="646" height="46" rx="8" fill="url(#titlebar)"/>
  <text x="360" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d4d4d">Pi Supervisor</text>
  <circle cx="60" cy="52" r="7" fill="#ff5f57" stroke="#e0443e"/>
  <circle cx="82" cy="52" r="7" fill="#febc2e" stroke="#d89e23"/>
  <circle cx="104" cy="52" r="7" fill="#28c840" stroke="#1aab29"/>

  <!-- ─── tab card ─── -->
  <!-- unselected tabs (bottom edges hidden behind the content card) -->
  <rect x="166" y="96" width="150" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="241" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Background Services</text>
  <rect x="320" y="96" width="90" height="28" rx="5" fill="url(#btn)" stroke="#9d9d9d"/>
  <text x="365" y="114" text-anchor="middle" font-size="11" fill="#4d4d4d">Sandbox</text>

  <!-- content card: Sessions tab active, fills remaining height -->
  <rect x="52" y="120" width="616" height="440" rx="6" fill="#ffffff" stroke="#c9c9c9"/>

  <!-- selected tab (drawn over the card edge: seamless join, open bottom) -->
  <path d="M52 122 V94 Q52 90 56 90 H158 Q162 90 162 94 V122" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="107" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d1d1f">Sessions</text>
  <text x="428" y="114" font-size="10" fill="#8e8e93">click a tab to switch module ←/→</text>

