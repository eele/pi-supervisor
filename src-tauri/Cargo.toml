[package]
name = "pi-supervisor"
version = "0.1.0"
description = "Pi Supervisor - host daemon manager for the pi coding-agent sandbox"
authors = ["eele"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Without this feature a release exe still loads build.devUrl (5173) and
# shows "localhost refused to connect". `tauri build` adds it automatically;
# plain `cargo build --release` must be given it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Security",
] }
